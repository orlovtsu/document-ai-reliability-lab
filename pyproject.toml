[tool.ruff]
line-length = 120

[tool.ruff.lint]
# B008: function calls in argument defaults are flagged by default, but this
# codebase uses frozen (immutable) dataclasses as config objects with
# `config: SyntheticConfig = SyntheticConfig()`-style defaults, which is safe
# since the default is never mutated. Ignoring here rather than refactoring
# every call site.
ignore = ["B008"]

[tool.pytest.ini_options]
# Without this, `pytest -q` invoked as a console script (as CI does) does not
# add the repo root to sys.path, so the top-level package is unimportable in
# tests. `python -m pytest` masks this locally by adding cwd automatically.
pythonpath = ["."]
